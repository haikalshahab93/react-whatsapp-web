name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    name: Type check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build the web app
        run: npm run build

      - name: Install API dependencies
        working-directory: server
        run: npm ci

      # The suite starts its own in-memory MongoDB, so no database service is needed.
      - name: Run API and Socket.IO tests
        working-directory: server
        run: npm test
