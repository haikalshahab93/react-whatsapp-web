# Render blueprint. Apply it from the Render dashboard ("New +" -> "Blueprint")
# after pushing this repository, or copy the settings into a manual web service.
#
# MongoDB is not included: create a free MongoDB Atlas M0 cluster and paste its
# connection string into MONGO_URI (see DEPLOY.md).
services:
  - type: web
    name: chateasy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      # Optional integrations — leave empty to use the development fallbacks.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Optional: enables Web Push while the app is closed.
      # Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
